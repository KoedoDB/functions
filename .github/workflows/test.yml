name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install workerd (the version of workerd/package-lock.json; npm checks its integrity)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: workerd
      - name: Run the supervisor (both runtimes) and the LRU of resident functions
        run: go test -race ./...
        env:
          WORKERD_BIN: ${{ github.workspace }}/workerd/node_modules/@cloudflare/workerd-linux-64/bin/workerd
