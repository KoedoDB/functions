name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install workerd (the version of workerd/package-lock.json; npm checks its integrity)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: workerd
      - name: Unit tests (settings, limits, routes, the configuration, the router against a fake spawner, the LRU)
        run: go vet ./... && go test -race ./...
        env:
          WORKERD_BIN: ${{ github.workspace }}/workerd/node_modules/@cloudflare/workerd-linux-64/bin/workerd
      - name: All the tests as the Pod runs the code (root with four capabilities, a real workerd, the race detector)
        run: scripts/test-in-docker.sh

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t koedodb-functions .
      - name: Run it as the Pod does (spawner and router, mutual TLS) and try the wall between two customers, a loop and a memory bomb
        run: scripts/image-test.sh koedodb-functions
